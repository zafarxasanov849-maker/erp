# Supabase migratsiyalari: avval toza bazada tekshiriladi (migratsiyalar + pgTAP),
# keyin production loyihaga `supabase db push` bilan qo'llanadi.
#
# Kerakli GitHub secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD  — Project Settings → Database → Database password
name: DB migrations

on:
  push:
    branches: [claude/new-session-jdpm2v] # Vercel production branch bilan bir xil
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/db-migrate.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

# Ikki push ketma-ket kelsa ham migratsiyalar bir vaqtda qo'llanmaydi
concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.119.0
  SUPABASE_PROJECT_ID: mgukxajmqsagitghkfld

jobs:
  test:
    name: Migratsiyalar + pgTAP (toza baza)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Faqat kerakli servislar: Postgres, Auth (auth.users), Storage (storage.buckets), REST
      - name: Lokal Supabase
        run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: pgTAP testlari
        run: supabase test db
      - name: To'xtatish
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Production'ga qo'llash
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/claude/new-session-jdpm2v'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Secrets hali kiritilmagan bo'lsa — migratsiyalar qo'lda (SQL Editor) qo'llanadi, job xatosiz o'tadi
      - name: Secrets tekshiruvi
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Secrets yo'q — avtomatik qo'llash o'tkazib yuborildi. Migratsiyani SQL Editor'da qo'lda qo'llang."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Loyihaga ulanish
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Qo'llanadigan migratsiyalar
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Qo'llash
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
